<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111827">
<title>Plan Builder</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f6f8}
*{box-sizing:border-box} body{margin:0} button,input,textarea,select{font:inherit}
header{position:sticky;top:0;background:#111827;color:white;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;z-index:5}
header b{font-size:19px}.wrap{max-width:780px;margin:auto;padding:16px 16px calc(30px + env(safe-area-inset-bottom))}
.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 7px #0001}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:12px;padding:11px 14px;background:#e8ebf0;color:#111827;font-weight:650}.primary{background:#111827;color:white}.danger{background:#fee2e2;color:#991b1b}
input,textarea,select{width:100%;border:1px solid #d7dce3;border-radius:11px;padding:10px;background:white}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}
.muted{color:#667085;font-size:14px}.hide{display:none!important}.tabs{display:flex;gap:8px;margin-top:10px}.tabs .btn{flex:1}
.choice{width:100%;text-align:left;border:0;background:white;border-radius:18px;padding:0;overflow:hidden;box-shadow:0 1px 8px #0002;margin:12px 0}
.choice img,.hero{display:block;width:100%;max-height:280px;object-fit:cover}.choice .ct{padding:15px;font-size:18px;font-weight:700}
.item img{width:100%;max-height:240px;object-fit:cover;border-radius:13px}.pill{font-size:12px;background:#eef2ff;padding:4px 8px;border-radius:999px}
hr{border:0;border-top:1px solid #eceff3;margin:16px 0}h2,h3{margin:4px 0 10px}
</style><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"></head>
<body>

<header id="topbar"><b>Decision Plan</b> <span style="font-size:12px;opacity:.65">v5.8.2</span> <button id="updateAppBtn" class="btn" style="padding:5px 8px;font-size:12px;margin-left:8px" onclick="forceAppUpdate()">↻ Actualizar app</button><div class="tabs"><button class="btn primary" onclick="showHome()">Planes</button><button class="btn primary" onclick="setUIMode('run')">▶ Modo Ejecución</button><button class="btn" onclick="configureAdminPin()">🔐 PIN</button></div></header><div id="app" class="wrap"></div>
<script>
const KEY="decision_planner_v3";
let db={plans:[],finalizations:[]}, current=null, history=[], awarded=[];
let uiMode=localStorage.getItem("dp_ui_mode")||"admin";
const SESSION_KEY="dp_execution_session_v1",PIN_KEY="dp_admin_pin_v1";
function saveExec(screen="decision",finalId=null,nextDecisionId=null){if(current)localStorage.setItem(SESSION_KEY,JSON.stringify({planId:current.id,history,awarded,screen,finalId,nextDecisionId}))}
function getExec(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch(e){return null}}
function closeExec(){if(!confirm("¿Cerrar la sesión de ejecución actual? Se eliminará únicamente su recorrido e ítems obtenidos; los planes no se modifican."))return;localStorage.removeItem(SESSION_KEY);history=[];awarded=[];current=null;showRunHome()}
function configureAdminPin(){let old=localStorage.getItem(PIN_KEY);if(old){let x=prompt("PIN de administración actual");if(x===null)return;if(x!==old)return alert("PIN incorrecto.")}let a=prompt("Nuevo PIN de administración (4 a 8 dígitos)");if(a===null)return;if(!/^\d{4,8}$/.test(a))return alert("El PIN debe tener entre 4 y 8 dígitos.");let b=prompt("Repetí el nuevo PIN");if(b!==a)return alert("Los PIN no coinciden.");localStorage.setItem(PIN_KEY,a);alert("PIN guardado.")}
function requestAdmin(){let pin=localStorage.getItem(PIN_KEY);if(!pin){if(confirm("Todavía no configuraste un PIN. ¿Volver a Administración?"))setUIMode("admin");return}let x=prompt("PIN de administración");if(x===null)return;if(x!==pin)return alert("PIN incorrecto.");setUIMode("admin")}
function resumeExec(){let s=getExec();if(!s)return;let p=db.plans.find(x=>x.id===s.planId);if(!p){localStorage.removeItem(SESSION_KEY);return showRunHome()}current=p;history=Array.isArray(s.history)?s.history:[];awarded=Array.isArray(s.awarded)?s.awarded:[];if(s.screen==="final")return results(s.finalId||null);let next=s.nextDecisionId||current.start;if(!next)return alert("No se encontró una decisión para continuar.");setExecutionMode(true);return renderPlay(next)}
function setUIMode(mode){uiMode=mode;localStorage.setItem("dp_ui_mode",mode);mode==="run"?showRunHome():showHome()}
function showRunHome(){setExecutionMode(false);let s=getExec(),visible=db.plans.filter(p=>planType(p)==="principal"&&p.showInPlayer!==false);$('#app').innerHTML=`<div class=card><h2>Ejecutar</h2>${s?`<button class=choice onclick="resumeExec()"><div class=ct>Continuar ejecución anterior</div></button>`:`<div class=muted>Elegí un plan para comenzar.</div>`}</div>`+(!s&&visible.length?visible.map(p=>`<button class=choice onclick="play('${p.id}')"><div class=ct>${esc(p.name)}</div></button>`).join(""):"")+`<div class=card style="margin-top:28px">${s?`<button class=btn onclick="closeExec()">Cerrar sesión de ejecución</button>`:""} <button class=btn onclick="requestAdmin()">⚙ Administración</button></div>`}
function returnToAdmin(){requestAdmin()}

function idbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open("DecisionPlanDB",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function idbLoad(){const d=await idbOpen();return new Promise((resolve,reject)=>{const r=d.transaction("kv").objectStore("kv").get(KEY);r.onsuccess=()=>resolve(r.result||{plans:[]});r.onerror=()=>reject(r.error)})}
async function idbSave(){const d=await idbOpen();return new Promise((resolve,reject)=>{const r=d.transaction("kv","readwrite").objectStore("kv").put(db,KEY);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
const $=s=>document.querySelector(s), uid=()=>crypto.randomUUID();
function save(){idbSave()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fileData(inp,cb){let f=inp.files[0]; if(!f)return cb(''); let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}
function setExecutionMode(on){let bar=document.getElementById("topbar");if(bar)bar.style.display=on?"none":""}
function showHome(){
 setExecutionMode(false);if(!db.finalizations)db.finalizations=[];if(uiMode==="run")return showRunHome();
 let group=(t,title)=>`<div class=card><h2>${title}</h2><button class="btn primary" onclick="newPlanOfType('${t}')">+ Nuevo</button></div>`+
 (db.plans.filter(p=>planType(p)===t).length?db.plans.filter(p=>planType(p)===t).map(p=>`<div class=card><b>${esc(p.name)}</b><div class=muted>${p.decisions.length} decisiones</div><div class=row style="margin-top:10px"><button class=btn onclick="openBuilder('${p.id}')">Editar</button><button class=btn onclick="clonePlan('${p.id}')">Clonar</button><button class="btn danger" onclick="delPlan('${p.id}')">Eliminar</button></div></div>`).join(""):`<div class=card><div class=muted>No hay elementos.</div></div>`);
 $('#app').innerHTML=group("principal","Planes principales")+group("secondary","Planes secundarios")+group("deep","Ideas")+
 `<div class=card><h2>Finalizaciones</h2><button class="btn primary" onclick="listFinalizations()">Administrar finalizaciones</button></div>`+
 `<div class=card><h2>Backup</h2><div class=row><button class=btn onclick="exportAll()">Crear backup</button><label class=btn>Restaurar backup<input type=file accept=".json,application/json" style="display:none" onchange="importAll(this)"></label></div></div>`;
}
function planType(p){return p.type||"principal"}
function planTypeLabel(t){return t==="secondary"?"Plan secundario":t==="deep"?"Profundizar tema":"Plan principal"}
function newPlanOfType(t){let p={id:uid(),name:t==="deep"?"Nueva Idea":"Nuevo plan",type:t,hideNameInPlayer:true,showInPlayer:t==="principal",start:null,decisions:[],items:[]};if(t==="deep")ensureIdeaLevels(p);db.plans.push(p);save();openBuilder(p.id)}
function newPlan(){let p={id:uid(),name:"Nuevo plan",type:"principal",hideNameInPlayer:true,showInPlayer:true,start:null,decisions:[],items:[]};db.plans.push(p);save();editPlan(p.id)}
function editPlan(id){current=db.plans.find(p=>p.id===id); renderBuilder()}
function ensureIdeaLevels(p){
 if(!p.ideaLevels)p.ideaLevels={
  soft:{text:p.ideaDefinition||"",yes:"Sí",no:"No",up:"Subir",result:""},
  medium:{text:"",yes:"Sí",no:"No",up:"Subir",result:""},
  hard:{text:"",yes:"Sí",no:"No",result:""}
 };
 ["soft","medium","hard"].forEach(k=>{
  if(!p.ideaLevels[k])p.ideaLevels[k]={text:"",yes:"Sí",no:"No",...(k!=="hard"?{up:"Subir"}:{}),result:""};
  if(p.ideaLevels[k].result==null)p.ideaLevels[k].result="";
 });
 return p.ideaLevels;
}
function renderIdeaBuilder(){
 let L=ensureIdeaLevels(current);
 $('#app').innerHTML=`<div class=card><h2>Idea</h2><div class=row><button class=btn onclick="showHome()">← Volver a categorías</button></div><label>Nombre de la Idea</label><input id=idea_name value="${esc(current.name||"")}"><div class=muted style="margin-top:8px">R1 siempre entra por Soft. “Subir” acepta el nivel actual y continúa. Un “No” en Medium/Hard muestra el resultado del último nivel aceptado.</div></div>
 ${ideaLevelEditor("soft","Soft",L.soft,true)}
 ${ideaLevelEditor("medium","Medium",L.medium,true)}
 ${ideaLevelEditor("hard","Hard",L.hard,false)}
 <div class=card><button class="btn primary" onclick="saveIdeaLevels()">Guardar Idea</button></div>`;
}
function ideaLevelEditor(k,label,x,up){return `<div class=card><h2>${label}</h2><label>Narrativa</label><textarea id="il_${k}_text">${esc(x.text||"")}</textarea><label>Texto visible — Sí</label><input id="il_${k}_yes" value="${esc(x.yes||"Sí")}"><label>Texto visible — No</label><input id="il_${k}_no" value="${esc(x.no||"No")}">${up?`<label>Texto visible — Subir</label><input id="il_${k}_up" value="${esc(x.up||"Subir")}">`:""}<label>Texto final de ${label}</label><textarea id="il_${k}_result" placeholder="Se muestra únicamente cuando ${label} queda como resultado final">${esc(x.result||"")}</textarea></div>`}
function saveIdeaLevels(){
 let L=ensureIdeaLevels(current);current.name=$("#idea_name").value;
 ["soft","medium","hard"].forEach(k=>{L[k].text=$("#il_"+k+"_text").value;L[k].yes=$("#il_"+k+"_yes").value;L[k].no=$("#il_"+k+"_no").value;L[k].result=$("#il_"+k+"_result").value;let u=$("#il_"+k+"_up");if(u)L[k].up=u.value});
 save();renderIdeaBuilder();
}
function openBuilder(id){let p=db.plans.find(x=>x.id===id);if(!p)return alert("No se encontró el plan.");current=p;if(planType(p)==="deep")return renderIdeaBuilder();renderBuilder()}
function renderBuilder(){let p=current;$('#app').innerHTML=`<div class=card><h2>Builder</h2><div class=row style="margin-bottom:12px"><button class=btn onclick="showHome()">← Volver a categorías</button></div><label>Nombre del plan</label><input value="${esc(p.name)}" onchange="current.name=this.value;save()"><label>Grupo</label><select onchange="current.type=this.value;save()"><option value="principal" ${planType(p)==="principal"?"selected":""}>Plan principal</option><option value="secondary" ${planType(p)==="secondary"?"selected":""}>Plan secundario</option><option value="deep" ${planType(p)==="deep"?"selected":""}>Idea</option></select>${planType(p)==="deep"?`<label>Definición de la idea</label><textarea onchange="current.ideaDefinition=this.value;save()" placeholder="Describí la idea que querés presentar">${esc(p.ideaDefinition||"")}</textarea>`:""}
${planType(p)!=="deep"?`<label style="display:flex;align-items:center;gap:10px;font-size:15px"><input type="checkbox" style="width:auto" ${p.hideNameInPlayer!==false?'checked':''} onchange="current.hideNameInPlayer=this.checked;save()"> Ocultar nombre del plan durante las decisiones</label>
<label style="display:flex;align-items:center;gap:10px;font-size:15px"><input type="checkbox" style="width:auto" ${p.showInPlayer!==false?'checked':''} onchange="current.showInPlayer=this.checked;save()"> Mostrar este plan en el panel Ejecutar</label>`:""}<div class=row style="margin-top:12px"><button class="btn primary" onclick="addDecision()">+ Decisión</button>${planType(p)!=="deep"?`<button class=btn onclick="addItem()">+ Ítem oculto</button>`:""}<button class=btn onclick="play('${p.id}')">▶ Preview</button></div></div>
${planType(p)!=="deep"?`<div class=card><h3>Ítems ocultos</h3>${p.items.length?p.items.map(i=>`<div><b>${esc(i.name)}</b> <button class=btn onclick="editItem('${i.id}')">Editar</button></div>`).join('<hr>'):'<span class=muted>Aún no hay ítems.</span>'}</div>`:""}
<div class=card><h3>Decisiones</h3>${p.decisions.length?p.decisions.map((d,n)=>`<div><span class=pill>${p.start===d.id?'INICIO':'#'+(n+1)}</span> <b>${esc(d.title||d.text||'Sin título')}</b><div class=row><button class=btn onclick="editDecision('${d.id}')">Editar</button><button class=btn onclick="cloneDecision('${d.id}')">Clonar</button><button class=btn onclick="playFrom('${p.id}','${d.id}')">▶ Probar desde aquí</button><button class=btn onclick="current.start='${d.id}';save();renderBuilder()">Hacer inicio</button></div></div>`).join('<hr>'):'<span class=muted>Aún no hay decisiones.</span>'}</div>`}
function deleteItem(id){let item=current.items.find(i=>i.id===id);if(!item)return;let used=[];current.decisions.forEach(d=>d.options.forEach(o=>{if(o.itemId===id)used.push(d.text||"Decisión sin título")}));let msg=used.length?`Este ítem está asignado desde: ${[...new Set(used)].join(", ")}. Al eliminarlo, esas opciones dejarán de otorgarlo. ¿Continuar?`:"¿Eliminar este ítem oculto?";if(!confirm(msg))return;current.decisions.forEach(d=>d.options.forEach(o=>{if(o.itemId===id)o.itemId=""}));current.items=current.items.filter(i=>i.id!==id);save();renderBuilder()}
function addItem(){let i={id:uid(),name:"Nuevo ítem",description:"",image:""};current.items.push(i);save();editItem(i.id)}
function editItem(id){let i=current.items.find(x=>x.id===id);$('#app').innerHTML=`<div class=card><h2>Ítem oculto</h2><label>Nombre</label><input id=n value="${esc(i.name)}"><label>Descripción</label><textarea id=d>${esc(i.description)}</textarea><label>Imagen</label><input id=im type=file accept="image/*">${i.image?`<img class=hero src="${i.image}">`:''}<div class=row style="margin-top:14px"><button class="btn primary" onclick="saveItem('${id}')">Guardar</button><button class=btn onclick=renderBuilder()>Cancelar</button><button class="btn danger" onclick="deleteItem('${id}')">Eliminar ítem</button></div></div>`}
function saveItem(id){let i=current.items.find(x=>x.id===id);i.name=$('#n').value;i.description=$('#d').value;fileData($('#im'),x=>{if(x)i.image=x;save();renderBuilder()})}
function addDecision(){let d={id:uid(),title:"",showTitle:false,text:"Nueva pregunta",image:"",options:[],deepLinks:[]};current.decisions.push(d);if(!current.start)current.start=d.id;save();editDecision(d.id)}
function listFinalizations(){setExecutionMode(false);if(!db.finalizations)db.finalizations=[];$('#app').innerHTML=`<div class=card><h2>Finalizaciones</h2><div class=row><button class="btn primary" onclick="newFinalization()">+ Finalización</button><button class=btn onclick="renderBuilder()">Volver al plan</button></div></div>`+(db.finalizations.length?db.finalizations.map(f=>`<div class=card><b>${esc(f.name||"Finalización sin nombre")}</b><div class=row style="margin-top:10px"><button class=btn onclick="editFinalization('${f.id}')">Editar</button></div></div>`).join(""):`<div class=card><div class=muted>No hay finalizaciones creadas.</div></div>`)}
function newFinalization(){if(!db.finalizations)db.finalizations=[];let f={id:uid(),name:"Nueva finalización",title:"Prepárate para…",intro:"",journeyMode:"all",journeyTitle:"",middle:"",itemsMode:"all",itemsTitle:"",finalTitle:"",outro:"",showFinish:true,finishLabel:"Finalizar",deepIntro:"",deepMode:"all",deepIncludeAll:false,deepLinks:[]};db.finalizations.push(f);save();editFinalization(f.id)}
function editFinalization(id){let f=db.finalizations.find(x=>x.id===id);if(!f)return;currentFinalizationId=id;$('#app').innerHTML=`<div class=card><h2>Editar finalización</h2><label>Nombre interno</label><input id=f_name value="${esc(f.name||"")}"><label>Título</label><textarea id=f_title>${esc(f.title||"")}</textarea><label>Texto inicial</label><textarea id=f_intro>${esc(f.intro||"")}</textarea><label>Recorrido</label><select id=f_journey><option value=all ${f.journeyMode==="all"?"selected":""}>Todo el recorrido</option><option value=current ${f.journeyMode==="current"?"selected":""}>Sólo plan actual</option><option value=none ${f.journeyMode==="none"?"selected":""}>No mostrar</option></select><label>Título del recorrido</label><textarea id=f_jtitle>${esc(f.journeyTitle||"")}</textarea><label>Texto entre recorrido e ítems</label><textarea id=f_middle>${esc(f.middle||"")}</textarea><label>Ítems obtenidos</label><select id=f_items><option value=all ${f.itemsMode==="all"?"selected":""}>Todos los obtenidos</option><option value=current ${f.itemsMode==="current"?"selected":""}>Sólo plan actual</option><option value=none ${f.itemsMode==="none"?"selected":""}>No mostrar</option></select><label>Título de ítems</label><textarea id=f_ititle>${esc(f.itemsTitle||"")}</textarea><label>Título final</label><textarea id=f_finaltitle>${esc(f.finalTitle||"")}</textarea><label>Texto final</label><textarea id=f_outro>${esc(f.outro||"")}</textarea><label style="display:flex;align-items:center;gap:10px;font-size:15px"><input id=f_showfinish type="checkbox" style="width:auto" ${f.showFinish!==false?'checked':''}> Mostrar botón de finalización</label><label>Texto del botón</label><input id=f_finishlabel value="${esc(f.finishLabel||"Finalizar")}"><h3 style="margin-top:20px">Ideas</h3><label>Texto introductorio a Ideas</label><textarea id=f_deepintro>${esc(f.deepIntro||"")}</textarea><label>Cómo mostrar las Ideas</label><select id=f_deepmode><option value=all ${(f.deepMode||"all")==="all"?"selected":""}>Todas</option><option value=r1 ${(f.deepMode==="r1"||f.deepMode==="random")?"selected":""}>R1 — Idea aleatoria</option></select><label style="display:flex;align-items:center;gap:10px;font-size:15px"><input id=f_deepall type=checkbox style="width:auto" ${f.deepIncludeAll===true?'checked':''}> Incluir todas las Ideas</label><div class=muted>R1 siempre comienza en Soft. Si “Incluir todas” está apagado, usa sólo las Ideas seleccionadas debajo.</div><div id=f_deeplinks>${(f.deepLinks||[]).map(x=>finalDeepEditor(x)).join("")}</div><button class=btn type=button onclick="addFinalDeep('${id}')">+ Idea</button><div class=row style="margin-top:12px"><button class="btn primary" onclick="saveFinalization('${id}')">Guardar</button><button class=btn onclick="listFinalizations()">Cancelar</button><button class="btn danger" onclick="deleteFinalization('${id}')">Eliminar finalización</button></div></div>`}
function finalDeepEditor(x){return `<div style="margin:12px 0;padding:12px;border:1px solid #e5e7eb;border-radius:10px"><label>Texto del botón</label><input id="fd_text_${x.id}" value="${esc(x.text||"Ver idea")}"><label>Tema</label><select id="fd_plan_${x.id}"><option value="">Seleccionar…</option>${deepPlans().map(p=>`<option value="${p.id}" ${x.planId===p.id?'selected':''}>${esc(p.name)}</option>`).join("")}</select><button class="btn danger" onclick="removeFinalDeep('${x.id}')">Eliminar</button></div>`}
function syncFinalDeep(f){(f.deepLinks||[]).forEach(x=>{let t=document.getElementById("fd_text_"+x.id),p=document.getElementById("fd_plan_"+x.id);if(t)x.text=t.value;if(p)x.planId=p.value})}
function addFinalDeep(id){let f=db.finalizations.find(x=>x.id===id);if(!f)return;syncFinalizationFields(f);if(!f.deepLinks)f.deepLinks=[];f.deepLinks.push({id:uid(),text:"Ver idea",planId:""});save();editFinalization(id)}
function removeFinalDeep(xid){let f=db.finalizations.find(x=>x.id===currentFinalizationId);if(!f)return;syncFinalizationFields(f);f.deepLinks=(f.deepLinks||[]).filter(x=>x.id!==xid);save();editFinalization(f.id)}
let currentFinalizationId=null;
function syncFinalizationFields(f){
 let ids={name:"f_name",title:"f_title",intro:"f_intro",journeyMode:"f_journey",journeyTitle:"f_jtitle",middle:"f_middle",itemsMode:"f_items",itemsTitle:"f_ititle",finalTitle:"f_finaltitle",outro:"f_outro",finishLabel:"f_finishlabel",deepIntro:"f_deepintro",deepMode:"f_deepmode"};
 Object.entries(ids).forEach(([k,id])=>{let e=document.getElementById(id);if(e)f[k]=e.value});
 let sf=document.getElementById("f_showfinish");if(sf)f.showFinish=sf.checked;let da=document.getElementById("f_deepall");if(da)f.deepIncludeAll=da.checked;syncFinalDeep(f);
}
function saveFinalization(id){let f=db.finalizations.find(x=>x.id===id);if(!f)return;syncFinalizationFields(f);save();listFinalizations()}

function deleteFinalization(id){let used=[];db.plans.forEach(p=>p.decisions.forEach(d=>d.options.forEach(o=>{if(o.next===`FINAL:${id}`)used.push(p.name)})));let msg=used.length?`Esta finalización está usada por: ${[...new Set(used)].join(", ")}. Al eliminarla, esas opciones pasarán a FIN estándar. ¿Continuar?`:"¿Eliminar esta finalización?";if(!confirm(msg))return;db.plans.forEach(p=>p.decisions.forEach(d=>d.options.forEach(o=>{if(o.next===`FINAL:${id}`)o.next="END"})));db.finalizations=db.finalizations.filter(f=>f.id!==id);save();listFinalizations()}
function cloneDecision(id){
 let src=current.decisions.find(x=>x.id===id);if(!src)return;
 let copy={...src,id:uid(),title:(src.title||src.text||"Decisión")+" (copia)",options:(src.options||[]).map(o=>({...o,id:uid()})),deepLinks:(src.deepLinks||[]).map(x=>({...x,id:uid()}))};
 current.decisions.push(copy);save();renderBuilder();
}
function deepPlans(){return db.plans.filter(p=>planType(p)==="deep")}
function deepLinkEditor(d,x){return `<div style="margin:12px 0;padding:12px;border:1px solid #e5e7eb;border-radius:10px"><label>Texto del botón</label><input id="dl_text_${x.id}" value="${esc(x.text||"Ver idea")}"><label>Tema</label><select id="dl_plan_${x.id}"><option value="">Seleccionar…</option>${deepPlans().map(p=>`<option value="${p.id}" ${x.planId===p.id?'selected':''}>${esc(p.name)}</option>`).join("")}</select><button class="btn danger" onclick="removeDeepLink('${d.id}','${x.id}')">Eliminar</button></div>`}
function syncDeepLinks(d){(d.deepLinks||[]).forEach(x=>{let t=document.getElementById("dl_text_"+x.id),p=document.getElementById("dl_plan_"+x.id);if(t)x.text=t.value;if(p)x.planId=p.value})}
function addDeepLink(did){let d=current.decisions.find(x=>x.id===did);if(!d)return;syncDecisionEditor(did);syncDeepLinks(d);if(!d.deepLinks)d.deepLinks=[];d.deepLinks.push({id:uid(),text:"Ver idea",planId:""});save();editDecision(did)}
function removeDeepLink(did,xid){let d=current.decisions.find(x=>x.id===did);if(!d)return;syncDecisionEditor(did);syncDeepLinks(d);d.deepLinks=(d.deepLinks||[]).filter(x=>x.id!==xid);save();editDecision(did)}
const LAST_IDEA_KEY="dp_last_idea_v1";
function startDeep(planId){
 if(planType(current)!=="deep"){let s=getExec();if(s)localStorage.setItem("dp_idea_return_v1",JSON.stringify(s));}
 let idea=db.plans.find(p=>p.id===planId&&planType(p)==="deep");if(!idea)return alert("La idea ya no existe.");
 current=idea;ensureIdeaLevels(idea);setExecutionMode(true);renderIdeaLevel("soft",null);
}
function renderIdeaLevel(level,lastAccepted){
 let L=ensureIdeaLevels(current),x=L[level];if(!x)return resumeFinalResult();
 let canUp=level!=="hard";
 $('#app').innerHTML=`<div class=card><div class=muted>${esc(current.name||"Idea")} · ${level[0].toUpperCase()+level.slice(1)}</div>${String(x.text||"").trim()?`<h2>${esc(x.text)}</h2>`:""}</div>
 <button class=choice onclick="chooseIdeaLevel('${level}','yes',${lastAccepted?`'${lastAccepted}'`:"null"})"><div class=ct>${esc(x.yes||"Sí")}</div></button>
 <button class=choice onclick="chooseIdeaLevel('${level}','no',${lastAccepted?`'${lastAccepted}'`:"null"})"><div class=ct>${esc(x.no||"No")}</div></button>
 ${canUp?`<button class=choice onclick="chooseIdeaLevel('${level}','up',${lastAccepted?`'${lastAccepted}'`:"null"})"><div class=ct>${esc(x.up||"Subir")}</div></button>`:""}
 <div style="text-align:center;margin:30px 0 12px"><button class=btn onclick="requestAdmin()">⚙</button></div>`;
}
function chooseIdeaLevel(level,action,lastAccepted){
 if(action==="yes")return showIdeaLevelResult(current.id,level);
 if(action==="up")return renderIdeaLevel(level==="soft"?"medium":"hard",level);
 // No en Soft vuelve al resultado del plan. No en Medium/Hard toma el último nivel aceptado como resultado final.
 if(lastAccepted)return showIdeaLevelResult(current.id,lastAccepted);
 return resumeFinalResult();
}
function showIdeaLevelResult(planId,level){
 let idea=db.plans.find(p=>p.id===planId);if(!idea)return;let x=ensureIdeaLevels(idea)[level];if(!x)return;
 localStorage.setItem(LAST_IDEA_KEY,JSON.stringify({planId:idea.id,level}));
 setExecutionMode(true);
 let txt=String(x.result||"").trim();
 $('#app').innerHTML=`<div class=card>${String(idea.name||"").trim()?`<h2>${esc(idea.name)}</h2>`:""}${txt?`<div>${esc(txt).replace(/\n/g,"<br>")}</div>`:`<div class=muted>Sin texto final configurado para ${esc(level)}.</div>`}</div><div class=row><button class=btn onclick="resumeFinalResult()">← Volver al resultado del plan</button></div><div style="text-align:center;margin:30px 0 12px"><button class=btn onclick="requestAdmin()">⚙</button></div>`;
}
function reopenLastIdea(){
 let s=null;try{s=JSON.parse(localStorage.getItem(LAST_IDEA_KEY)||"null")}catch(e){}
 if(!s||!s.planId||!s.level)return;
 let idea=db.plans.find(p=>p.id===s.planId&&planType(p)==="deep");if(!idea)return;
 current=idea;showIdeaLevelResult(idea.id,s.level);
}
function resumeFinalResult(){
 let r=null;try{r=JSON.parse(localStorage.getItem("dp_idea_return_v1")||"null")}catch(e){}
 if(r&&r.planId){let p=db.plans.find(x=>x.id===r.planId);if(p){current=p;history=Array.isArray(r.history)?r.history:[];awarded=Array.isArray(r.awarded)?r.awarded:[];localStorage.setItem(SESSION_KEY,JSON.stringify(r));return results(r.finalId||null,false)}}
 showRunHome();
}
function ideaPool(f){
 let all=deepPlans();if(f.deepIncludeAll===true)return all;
 let ids=new Set((f.deepLinks||[]).map(x=>x.planId).filter(Boolean));return all.filter(p=>ids.has(p.id));
}
function randomIdea(finalId){
 let f=(db.finalizations||[]).find(x=>x.id===finalId);if(!f)return;
 let pool=ideaPool(f);if(!pool.length)return alert("No hay Ideas configuradas para R1.");
 let x=pool[Math.floor(Math.random()*pool.length)];startDeep(x.id);
}
function editDecision(id){let d=current.decisions.find(x=>x.id===id);$('#app').innerHTML=`<div class=card><h2>Decisión</h2><label>Título interno</label><input id=qtitle value="${esc(d.title||"")}"><label style="display:flex;align-items:center;gap:10px;font-size:15px"><input id=qshowtitle type="checkbox" style="width:auto" ${d.showTitle===true?'checked':''}> Mostrar título durante la ejecución</label><label>Pregunta / texto visible</label><textarea id=q>${esc(d.text)}</textarea><label>Imagen de la pregunta</label><input id=qim type=file accept="image/*">${d.image?`<img class=hero src="${d.image}">`:''}<div class=row style="margin-top:12px"><button class="btn primary" onclick="saveDecision('${id}')">Guardar pregunta</button><button class=btn onclick="addOption('${id}')">+ Opción</button><button class=btn onclick=renderBuilder()>Volver</button><button class="btn danger" onclick="deleteDecision('${id}')">Eliminar decisión</button></div></div>`+`<div class=card><h3>Profundizar</h3><div class=muted>Botones opcionales que aparecen junto con esta decisión.</div>${(d.deepLinks||[]).map(x=>deepLinkEditor(d,x)).join("")}<button class=btn onclick="addDeepLink('${d.id}')">+ Idea</button></div>`+d.options.map(o=>optionEditor(d,o)).join('')}
function autoGrow(el){el.style.height="auto";el.style.height=Math.max(58,el.scrollHeight)+"px"}
function optionEditor(d,o){let decs=current.decisions.filter(x=>x.id!==d.id),items=current.items;return `<div class=card><h3>Opción visible</h3><label>Texto</label><textarea id="t_${o.id}" rows="2" style="min-height:58px;resize:vertical;overflow:hidden" oninput="autoGrow(this)">${esc(o.text||'')}</textarea><label>Imagen</label><input id="img_${o.id}" type=file accept="image/*">${o.image?`<img class=hero src="${o.image}">`:''}<label>Ítem oculto otorgado</label><select id="it_${o.id}"><option value="">Ninguno</option>${items.map(i=>`<option value="${i.id}" ${o.itemId===i.id?'selected':''}>${esc(i.name)}</option>`).join('')}</select><label>Siguiente paso</label><select id="nx_${o.id}"><option value="END" ${o.next==="END"||!o.next?'selected':''}>FIN estándar</option>${planType(current)!=="deep"?`<optgroup label="Finalizaciones">${(db.finalizations||[]).map(f=>`<option value="FINAL:${f.id}" ${o.next===`FINAL:${f.id}`?'selected':''}>${esc(f.name||"Finalización")}</option>`).join('')}</optgroup>`:""}<optgroup label="Decisiones de este plan">${decs.map(x=>`<option value="${x.id}" ${o.next===x.id?'selected':''}>${esc(x.title||x.text||'Sin título')}</option>`).join('')}</optgroup>${(planType(current)==="deep"?["deep"]:["principal","secondary","deep"]).map(t=>{let ps=db.plans.filter(p=>p.id!==current.id&&planType(p)===t);return ps.length?`<optgroup label="${t==="principal"?"Planes principales":t==="secondary"?"Planes secundarios":"Ideas"}">${ps.map(p=>`<option value="PLAN:${p.id}" ${o.next===`PLAN:${p.id}`?'selected':''}>${esc(p.name)}</option>`).join('')}</optgroup>`:""}).join('')}</select><div class=row style="margin-top:12px"><button class="btn primary" onclick="saveOption('${d.id}','${o.id}')">Guardar opción</button><button class="btn danger" onclick="delOption('${d.id}','${o.id}')">Eliminar</button></div></div>`}
function deleteDecision(id){
  let d=current.decisions.find(x=>x.id===id);if(!d)return;
  let incoming=[];
  current.decisions.forEach(x=>x.options.forEach(o=>{if(o.next===id)incoming.push(x.text||"Decisión sin título")}));
  let msg=incoming.length?`Esta decisión recibe conexiones desde: ${[...new Set(incoming)].join(", ")}. Al eliminarla, esas conexiones pasarán a FIN. ¿Continuar?`:"¿Eliminar esta decisión?";
  if(!confirm(msg))return;
  current.decisions.forEach(x=>x.options.forEach(o=>{if(o.next===id)o.next="END"}));
  current.decisions=current.decisions.filter(x=>x.id!==id);
  if(current.start===id)current.start=current.decisions[0]?.id||null;
  save();renderBuilder();
}
function addOption(did){let d=current.decisions.find(x=>x.id===did);syncDecisionEditor(did);d.options.push({id:uid(),text:"Nueva opción",image:"",itemId:"",next:"END"});save();editDecision(did)}
function saveDecision(id){let d=current.decisions.find(x=>x.id===id);syncDecisionEditor(id);syncDeepLinks(d);fileData($('#qim'),x=>{if(x)d.image=x;save();editDecision(id)})}
function syncDecisionEditor(did){let d=current.decisions.find(x=>x.id===did);if(!d)return;let qt=document.getElementById('qtitle'),qs=document.getElementById('qshowtitle'),q=document.getElementById('q');if(qt)d.title=qt.value;if(qs)d.showTitle=qs.checked;if(q)d.text=q.value;d.options.forEach(o=>{let t=document.getElementById('t_'+o.id),it=document.getElementById('it_'+o.id),nx=document.getElementById('nx_'+o.id);if(t)o.text=t.value;if(it)o.itemId=it.value;if(nx)o.next=nx.value})}
function saveOption(did,oid){let d=current.decisions.find(x=>x.id===did),o=d.options.find(x=>x.id===oid);syncDecisionEditor(did);fileData($('#img_'+oid),x=>{if(x)o.image=x;save();editDecision(did)})}
function delOption(did,oid){let d=current.decisions.find(x=>x.id===did);syncDecisionEditor(did);d.options=d.options.filter(x=>x.id!==oid);save();editDecision(did)}
function clonePlan(id){
  let src=db.plans.find(p=>p.id===id);if(!src)return;
  let dm={},im={};src.decisions.forEach(d=>dm[d.id]=uid());src.items.forEach(i=>im[i.id]=uid());
  let copy={...src,id:uid(),name:src.name+" (copia)",ideaLevels:src.ideaLevels?JSON.parse(JSON.stringify(src.ideaLevels)):src.ideaLevels,start:src.start?dm[src.start]:null,
    items:src.items.map(i=>({...i,id:im[i.id]})),
    decisions:src.decisions.map(d=>({...d,id:dm[d.id],options:d.options.map(o=>({...o,id:uid(),itemId:o.itemId?(im[o.itemId]||""):o.itemId,next:o.next==="END"?"END":String(o.next||"").startsWith("PLAN:")?o.next:(dm[o.next]||"END")}))}))
  };
  db.plans.push(copy);save();showHome();
}
function delPlan(id){let refs=[];db.plans.forEach(p=>p.decisions.forEach(d=>d.options.forEach(o=>{if(o.next===`PLAN:${id}`)refs.push(p.name)})));let msg=refs.length?`Este plan está conectado desde: ${[...new Set(refs)].join(", ")}. Si lo eliminás, esas conexiones quedarán rotas. ¿Eliminar igualmente?`:"¿Eliminar este plan?";if(confirm(msg)){db.plans=db.plans.filter(p=>p.id!==id);save();showHome()}}
function openPlayer(){let visible=db.plans.filter(p=>p.showInPlayer!==false);if(visible.length===1)return play(visible[0].id);if(!visible.length){$('#app').innerHTML='<div class=card><h2>No hay planes visibles</h2><div class=muted>Activá “Mostrar este plan en el panel Ejecutar” desde el Builder.</div></div>';return}$('#app').innerHTML='<div class=card><h2>Elegí un plan</h2></div>'+visible.map(p=>`<button class=choice onclick="play('${p.id}')"><div class=ct>${esc(p.name)}</div></button>`).join('')}
function play(id){current=db.plans.find(p=>p.id===id);history=[];awarded=[];if(!current.start)return alert("Este plan no tiene decisión inicial.");saveExec("decision",null,current.start);setExecutionMode(true);renderPlay(current.start)}
function playFrom(planId,decisionId){current=db.plans.find(p=>p.id===planId);history=[];awarded=[];setExecutionMode(true);renderPlay(decisionId)}
function renderPlay(id){let d=current.decisions.find(x=>x.id===id);if(!d)return results();let showName=current.hideNameInPlayer===false&&String(current.name||'').trim();let showTitle=d.showTitle===true&&String(d.title||'').trim();let showQuestion=String(d.text||'').trim();let intro=(showName||showTitle||showQuestion||d.image)?`<div class=card>${showName?`<div class=muted>${esc(current.name)}</div>`:''}${showTitle?`<h3>${esc(d.title)}</h3>`:''}${d.image?`<img class=hero src="${d.image}">`:''}${showQuestion?`<h2>${esc(d.text)}</h2>`:''}</div>`:'';$('#app').innerHTML=intro+d.options.map(o=>`<button class=choice onclick="choose('${d.id}','${o.id}')">${o.image?`<img src="${o.image}">`:''}<div class=ct>${esc(o.text)}</div></button>`).join('')+(d.deepLinks||[]).filter(x=>x.planId).map(x=>`<button class="choice" onclick="startDeep('${x.planId}')"><div class=ct>${esc(x.text||'Profundizar')}</div></button>`).join('')+`<div style="text-align:center;margin:30px 0 12px"><button class=btn style="font-size:18px;padding:8px 12px;opacity:.55" onclick="requestAdmin()" aria-label="Administración">⚙</button></div>`}
function choose(did,oid){let d=current.decisions.find(x=>x.id===did),o=d?.options.find(x=>x.id===oid);if(!d||!o)return alert("No se pudo continuar con esta opción.");history.push({planId:current.id,decisionId:did,optionId:oid});if(o.itemId)awarded.push({planId:current.id,itemId:o.itemId});let next=String(o.next||"END");if(next==="END"){saveExec("final",null,null);return results(null)}if(next.startsWith("FINAL:")){let fid=next.slice(6);saveExec("final",fid,null);return results(fid)}if(next.startsWith("PLAN:")){let target=db.plans.find(p=>p.id===next.slice(5));if(!target)return alert("El plan de destino ya no existe.");if(!target.start)return alert("El plan de destino no tiene decisión inicial.");current=target;saveExec("decision",null,target.start);return renderPlay(target.start)}if(!current.decisions.find(x=>x.id===next)){saveExec("final",null,null);return results(null)}saveExec("decision",null,next);return renderPlay(next)}
function lowerFirst(s=''){return s?s.charAt(0).toLocaleLowerCase()+s.slice(1):''}
function sentenceForChoice(question,option){
  let raw=String(question||'').trim(),o=lowerFirst(String(option||'').trim());
  if(!raw)return o;
  let isQuestion=raw.includes('?')||raw.includes('¿');
  let q=raw.replace(/^¿/,'').replace(/[?¿]+$/g,'').trim();
  let text=isQuestion?`${q}: ${o}`:`${q} ${o}`;
  text=text.replace(/\s+/g,' ').trim();
  return /[.!?…]$/.test(text)?text:text+'.';
}
function results(finalId=null,persist=true){setExecutionMode(true);if(persist)saveExec("final",finalId,null);let f=finalId?(db.finalizations||[]).find(x=>x.id===finalId):null;if(!f)f={title:"Prepárate para…",intro:"",journeyMode:"all",journeyTitle:"",middle:"",itemsMode:"all",itemsTitle:"",finalTitle:"",outro:"",showFinish:true,finishLabel:"Finalizar",deepIntro:"",deepMode:"all",deepIncludeAll:false,deepLinks:[]};let pid=current?.id,hh=f.journeyMode==="current"?history.filter(s=>(s.planId||pid)===pid):history;let journey=f.journeyMode==="none"?"":hh.map((s,n)=>{let pp=db.plans.find(x=>x.id===(s.planId||pid)),d=pp?.decisions.find(x=>x.id===s.decisionId),o=d?.options.find(x=>x.id===s.optionId);return o?`<div style="padding:10px 0;${n?'border-top:1px solid #eceff3':''}"><span class=muted>${n+1}.</span> ${esc(sentenceForChoice(d.text,o.text))}</div>`:""}).join("");let aa=f.itemsMode==="current"?awarded.filter(x=>typeof x!=="string"&&x.planId===pid):awarded,uniq=[],seen=new Set();if(f.itemsMode!=="none")aa.forEach(x=>{let p2=typeof x==="string"?pid:x.planId,iid=typeof x==="string"?x:x.itemId,k=p2+"|"+iid;if(seen.has(k))return;seen.add(k);let pp=db.plans.find(y=>y.id===p2),it=pp?.items.find(y=>y.id===iid);if(it)uniq.push(it)});let parts=[];if(String(f.title||"").trim())parts.push(`<div class=card><h2>${esc(f.title)}</h2></div>`);if(String(f.intro||"").trim())parts.push(`<div class=card>${esc(f.intro).replace(/\n/g,"<br>")}</div>`);if(journey)parts.push(`<div class=card>${String(f.journeyTitle||"").trim()?`<h3>${esc(f.journeyTitle)}</h3>`:""}${journey}</div>`);if(String(f.middle||"").trim())parts.push(`<div class=card>${esc(f.middle).replace(/\n/g,"<br>")}</div>`);if(uniq.length)parts.push(`<div class=card>${String(f.itemsTitle||"").trim()?`<h3>${esc(f.itemsTitle)}</h3>`:""}${uniq.map(i=>`<div class=item>${i.image?`<img src="${i.image}">`:""}${String(i.name||"").trim()?`<h3>${esc(i.name)}</h3>`:""}${String(i.description||"").trim()?`<div>${esc(i.description).replace(/\n/g,"<br>")}</div>`:""}</div>`).join("")}</div>`);if(String(f.finalTitle||"").trim())parts.push(`<div class=card><h2>${esc(f.finalTitle)}</h2></div>`);if(String(f.outro||"").trim())parts.push(`<div class=card>${esc(f.outro).replace(/\n/g,"<br>")}</div>`);
{let pool=ideaPool(f);if(pool.length){let body=(f.deepMode==="r1"||f.deepMode==="random")?`<button class="choice" onclick="randomIdea('${f.id||finalId}')"><div class=ct>🎲 Idea al azar</div></button>`:(f.deepIncludeAll===true?pool.map(x=>`<button class="choice" onclick="startDeep('${x.id}')"><div class=ct>${esc(x.name||"Ver idea")}</div></button>`).join(""):(f.deepLinks||[]).filter(x=>x.planId).map(x=>`<button class="choice" onclick="startDeep('${x.planId}')"><div class=ct>${esc(x.text||"Ver idea")}</div></button>`).join(""));parts.push(`<div class=card>${String(f.deepIntro||"").trim()?`<div style="margin-bottom:12px">${esc(f.deepIntro).replace(/\n/g,"<br>")}</div>`:""}${body}</div>`);}}
let li=null;try{li=JSON.parse(localStorage.getItem(LAST_IDEA_KEY)||"null")}catch(e){};if(li&&db.plans.some(p=>p.id===li.planId&&planType(p)==="deep"))parts.push(`<div class=row><button class=btn onclick="reopenLastIdea()">→ Volver a la última Idea revisada</button></div>`);
parts.push(`<footer class="card" style="margin-top:28px"><b>Decision Plan</b> <span style="font-size:12px;opacity:.65">v5.8.2</span><div class="tabs" style="margin-top:10px">${f.showFinish!==false?`<button class="btn primary" onclick="showRunHome()">✓ ${esc(f.finishLabel||"Finalizar")}</button>`:""}<button class=btn onclick="requestAdmin()">⚙ Administración</button></div></footer>`);
$('#app').innerHTML=parts.join("")}
async function exportAll(){let now=new Date();let payload={format:"DecisionPlanBackup",version:1,exportedAt:now.toISOString(),data:db};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='DecisionPlan-v5.8.2-backup-'+now.toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();localStorage.setItem("dp_last_backup",now.toISOString());setTimeout(()=>URL.revokeObjectURL(a.href),1000);showHome()}
function importAll(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let parsed=JSON.parse(r.result);let restored=(parsed&&parsed.format==="DecisionPlanBackup")?parsed.data:parsed;if(!restored||!Array.isArray(restored.plans))throw 0;if(!confirm(`Restaurar este backup reemplazará los ${db.plans.length} plan(es) actuales por ${restored.plans.length}. ¿Continuar?`))return;db=restored;await idbSave();showHome();alert("Backup restaurado correctamente.")}catch(e){alert("El archivo no es un backup válido de Decision Plan.")}};r.readAsText(f)}
idbLoad().then(x=>{db=x;showHome()}).catch(()=>showHome());
async function forceAppUpdate(){
  const b=document.getElementById("updateAppBtn");
  if(b){b.disabled=true;b.textContent="Buscando…";}
  try{
    if(!("serviceWorker" in navigator)){location.reload();return;}
    const reg=await navigator.serviceWorker.getRegistration("./") || await navigator.serviceWorker.register("./sw.js");
    await reg.update();
    if(reg.waiting){
      reg.waiting.postMessage({type:"SKIP_WAITING"});
      return;
    }
    if(reg.installing){
      reg.installing.addEventListener("statechange",()=>{
        if(reg.installing && reg.installing.state==="installed"){
          reg.installing.postMessage({type:"SKIP_WAITING"});
        }
      });
      return;
    }
    location.reload();
  }catch(e){
    alert("No se pudo comprobar la actualización. Verificá la conexión e intentá nuevamente.");
    if(b){b.disabled=false;b.textContent="↻ Actualizar app";}
  }
}
if("serviceWorker" in navigator){
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(reloading)return; reloading=true; location.reload();
  });
  window.addEventListener("load",async()=>{
    try{
      const reg=await navigator.serviceWorker.register("./sw.js");
      await reg.update();
      if(reg.waiting) reg.waiting.postMessage({type:"SKIP_WAITING"});
    }catch(e){}
  });
}
