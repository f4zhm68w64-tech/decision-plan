<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111827">
<title>Plan Builder</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f6f8}
*{box-sizing:border-box} body{margin:0} button,input,textarea,select{font:inherit}
header{position:sticky;top:0;background:#111827;color:white;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;z-index:5}
header b{font-size:19px}.wrap{max-width:780px;margin:auto;padding:16px 16px calc(30px + env(safe-area-inset-bottom))}
.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 7px #0001}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:12px;padding:11px 14px;background:#e8ebf0;color:#111827;font-weight:650}.primary{background:#111827;color:white}.danger{background:#fee2e2;color:#991b1b}
input,textarea,select{width:100%;border:1px solid #d7dce3;border-radius:11px;padding:10px;background:white}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}
.muted{color:#667085;font-size:14px}.hide{display:none!important}.tabs{display:flex;gap:8px;margin-top:10px}.tabs .btn{flex:1}
.choice{width:100%;text-align:left;border:0;background:white;border-radius:18px;padding:0;overflow:hidden;box-shadow:0 1px 8px #0002;margin:12px 0}
.choice img,.hero{display:block;width:100%;max-height:280px;object-fit:cover}.choice .ct{padding:15px;font-size:18px;font-weight:700}
.item img{width:100%;max-height:240px;object-fit:cover;border-radius:13px}.pill{font-size:12px;background:#eef2ff;padding:4px 8px;border-radius:999px}
hr{border:0;border-top:1px solid #eceff3;margin:16px 0}h2,h3{margin:4px 0 10px}
</style><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"></head>
<body>

<header id="topbar"><b>Decision Plan</b> <span style="font-size:12px;opacity:.65">v5.4</span> <button id="updateAppBtn" class="btn" style="padding:5px 8px;font-size:12px;margin-left:8px" onclick="forceAppUpdate()">↻ Actualizar app</button><div class="tabs"><button class="btn primary" onclick="showHome()">Planes</button><button class="btn primary" onclick="setUIMode('run')">▶ Modo Ejecución</button></div></header><div id="app" class="wrap"></div>
<script>
const KEY="decision_planner_v3";
let db={plans:[],finalizations:[]}, current=null, history=[], awarded=[];
let uiMode=localStorage.getItem("dp_ui_mode")||"admin";
function setUIMode(mode){uiMode=mode;localStorage.setItem("dp_ui_mode",mode);mode==="run"?showRunHome():showHome()}
function showRunHome(){setExecutionMode(false);let visible=db.plans.filter(p=>p.showInPlayer!==false);$('#app').innerHTML=`<div class=card><h2>Ejecutar</h2><div class=muted>Elegí un plan para comenzar.</div></div>`+(visible.length?visible.map(p=>`<button class=choice onclick="play('${p.id}')"><div class=ct>${esc(p.name)}</div></button>`).join(""):`<div class=card><div class=muted>No hay planes visibles para ejecutar.</div></div>`)+`<div class=card style="margin-top:28px"><button class=btn onclick="returnToAdmin()">⚙ Volver a Administración</button></div>`}
function returnToAdmin(){if(history.length&&current&&!confirm("Volver a Administración no elimina tus planes. ¿Continuar?"))return;setUIMode("admin")}

function idbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open("DecisionPlanDB",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function idbLoad(){const d=await idbOpen();return new Promise((resolve,reject)=>{const r=d.transaction("kv").objectStore("kv").get(KEY);r.onsuccess=()=>resolve(r.result||{plans:[]});r.onerror=()=>reject(r.error)})}
async function idbSave(){const d=await idbOpen();return new Promise((resolve,reject)=>{const r=d.transaction("kv","readwrite").objectStore("kv").put(db,KEY);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
const $=s=>document.querySelector(s), uid=()=>crypto.randomUUID();
function save(){idbSave()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fileData(inp,cb){let f=inp.files[0]; if(!f)return cb(''); let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}
function setExecutionMode(on){let bar=document.getElementById("topbar");if(bar)bar.style.display=on?"none":""}
function showHome(){setExecutionMode(false);if(!db.finalizations)db.finalizations=[];if(uiMode==="run")return showRunHome();current=null;let lb=localStorage.getItem("dp_last_backup");$('#app').innerHTML=`<div class=card><h2>Mis planes</h2><p class=muted>Los planes, textos e imágenes se guardan localmente en este dispositivo.</p><p class=muted><b>Último backup:</b> ${lb?new Date(lb).toLocaleString():'Nunca'}</p><button class="btn primary" onclick="newPlan()">+ Nuevo plan</button> <button class=btn onclick="exportAll()">Crear backup</button> <label class=btn style="display:inline-block">Restaurar backup<input class=hide type=file accept=".json,application/json" onchange="importAll(this)"></label></div>`+db.plans.map(p=>`<div class=card><h3>${esc(p.name)}</h3><div class=row><button class="btn primary" onclick="editPlan('${p.id}')">Editar</button><button class=btn onclick="play('${p.id}')">▶ Probar</button><button class=btn onclick="clonePlan('${p.id}')">Clonar</button><button class="btn danger" onclick="delPlan('${p.id}')">Eliminar</button></div><div class=muted>${p.decisions.length} decisiones · ${p.items.length} ítems</div></div>`).join('')}
function newPlan(){let p={id:uid(),name:"Nuevo plan",hideNameInPlayer:true,showInPlayer:true,start:null,decisions:[],items:[]};db.plans.push(p);save();editPlan(p.id)}
function editPlan(id){current=db.plans.find(p=>p.id===id); renderBuilder()}
function renderBuilder(){let p=current;$('#app').innerHTML=`<div class=card><h2>Builder</h2><label>Nombre del plan</label><input value="${esc(p.name)}" onchange="current.name=this.value;save()">
<label style="display:flex;align-items:center;gap:10px;font-size:15px"><input type="checkbox" style="width:auto" ${p.hideNameInPlayer!==false?'checked':''} onchange="current.hideNameInPlayer=this.checked;save()"> Ocultar nombre del plan durante las decisiones</label>
<label style="display:flex;align-items:center;gap:10px;font-size:15px"><input type="checkbox" style="width:auto" ${p.showInPlayer!==false?'checked':''} onchange="current.showInPlayer=this.checked;save()"> Mostrar este plan en el panel Ejecutar</label><div class=row style="margin-top:12px"><button class="btn primary" onclick="addDecision()">+ Decisión</button><button class=btn onclick="addItem()">+ Ítem oculto</button><button class=btn onclick="listFinalizations()">Finalizaciones</button><button class=btn onclick="play('${p.id}')">▶ Preview</button></div></div>
<div class=card><h3>Ítems ocultos</h3>${p.items.length?p.items.map(i=>`<div><b>${esc(i.name)}</b> <button class=btn onclick="editItem('${i.id}')">Editar</button></div>`).join('<hr>'):'<span class=muted>Aún no hay ítems.</span>'}</div>
<div class=card><h3>Decisiones</h3>${p.decisions.length?p.decisions.map((d,n)=>`<div><span class=pill>${p.start===d.id?'INICIO':'#'+(n+1)}</span> <b>${esc(d.text||'Sin título')}</b><div class=row><button class=btn onclick="editDecision('${d.id}')">Editar</button><button class=btn onclick="playFrom('${p.id}','${d.id}')">▶ Probar desde aquí</button><button class=btn onclick="current.start='${d.id}';save();renderBuilder()">Hacer inicio</button></div></div>`).join('<hr>'):'<span class=muted>Aún no hay decisiones.</span>'}</div>`}
function deleteItem(id){let item=current.items.find(i=>i.id===id);if(!item)return;let used=[];current.decisions.forEach(d=>d.options.forEach(o=>{if(o.itemId===id)used.push(d.text||"Decisión sin título")}));let msg=used.length?`Este ítem está asignado desde: ${[...new Set(used)].join(", ")}. Al eliminarlo, esas opciones dejarán de otorgarlo. ¿Continuar?`:"¿Eliminar este ítem oculto?";if(!confirm(msg))return;current.decisions.forEach(d=>d.options.forEach(o=>{if(o.itemId===id)o.itemId=""}));current.items=current.items.filter(i=>i.id!==id);save();renderBuilder()}
function addItem(){let i={id:uid(),name:"Nuevo ítem",description:"",image:""};current.items.push(i);save();editItem(i.id)}
function editItem(id){let i=current.items.find(x=>x.id===id);$('#app').innerHTML=`<div class=card><h2>Ítem oculto</h2><label>Nombre</label><input id=n value="${esc(i.name)}"><label>Descripción</label><textarea id=d>${esc(i.description)}</textarea><label>Imagen</label><input id=im type=file accept="image/*">${i.image?`<img class=hero src="${i.image}">`:''}<div class=row style="margin-top:14px"><button class="btn primary" onclick="saveItem('${id}')">Guardar</button><button class=btn onclick=renderBuilder()>Cancelar</button><button class="btn danger" onclick="deleteItem('${id}')">Eliminar ítem</button></div></div>`}
function saveItem(id){let i=current.items.find(x=>x.id===id);i.name=$('#n').value;i.description=$('#d').value;fileData($('#im'),x=>{if(x)i.image=x;save();renderBuilder()})}
function addDecision(){let d={id:uid(),text:"Nueva pregunta",image:"",options:[]};current.decisions.push(d);if(!current.start)current.start=d.id;save();editDecision(d.id)}
function listFinalizations(){setExecutionMode(false);if(!db.finalizations)db.finalizations=[];$('#app').innerHTML=`<div class=card><h2>Finalizaciones</h2><div class=row><button class="btn primary" onclick="newFinalization()">+ Finalización</button><button class=btn onclick="renderBuilder()">Volver al plan</button></div></div>`+(db.finalizations.length?db.finalizations.map(f=>`<div class=card><b>${esc(f.name||"Finalización sin nombre")}</b><div class=row style="margin-top:10px"><button class=btn onclick="editFinalization('${f.id}')">Editar</button></div></div>`).join(""):`<div class=card><div class=muted>No hay finalizaciones creadas.</div></div>`)}
function newFinalization(){if(!db.finalizations)db.finalizations=[];let f={id:uid(),name:"Nueva finalización",title:"Prepárate para…",intro:"",journeyMode:"all",journeyTitle:"",middle:"",itemsMode:"all",itemsTitle:"",outro:""};db.finalizations.push(f);save();editFinalization(f.id)}
function editFinalization(id){let f=db.finalizations.find(x=>x.id===id);if(!f)return;$('#app').innerHTML=`<div class=card><h2>Editar finalización</h2><label>Nombre interno</label><input id=f_name value="${esc(f.name||"")}"><label>Título</label><textarea id=f_title>${esc(f.title||"")}</textarea><label>Texto inicial</label><textarea id=f_intro>${esc(f.intro||"")}</textarea><label>Recorrido</label><select id=f_journey><option value=all ${f.journeyMode==="all"?"selected":""}>Todo el recorrido</option><option value=current ${f.journeyMode==="current"?"selected":""}>Sólo plan actual</option><option value=none ${f.journeyMode==="none"?"selected":""}>No mostrar</option></select><label>Título del recorrido</label><textarea id=f_jtitle>${esc(f.journeyTitle||"")}</textarea><label>Texto entre recorrido e ítems</label><textarea id=f_middle>${esc(f.middle||"")}</textarea><label>Ítems obtenidos</label><select id=f_items><option value=all ${f.itemsMode==="all"?"selected":""}>Todos los obtenidos</option><option value=current ${f.itemsMode==="current"?"selected":""}>Sólo plan actual</option><option value=none ${f.itemsMode==="none"?"selected":""}>No mostrar</option></select><label>Título de ítems</label><textarea id=f_ititle>${esc(f.itemsTitle||"")}</textarea><label>Texto final</label><textarea id=f_outro>${esc(f.outro||"")}</textarea><div class=row style="margin-top:12px"><button class="btn primary" onclick="saveFinalization('${id}')">Guardar</button><button class=btn onclick="listFinalizations()">Cancelar</button><button class="btn danger" onclick="deleteFinalization('${id}')">Eliminar finalización</button></div></div>`}
function saveFinalization(id){let f=db.finalizations.find(x=>x.id===id);if(!f)return;f.name=$('#f_name').value;f.title=$('#f_title').value;f.intro=$('#f_intro').value;f.journeyMode=$('#f_journey').value;f.journeyTitle=$('#f_jtitle').value;f.middle=$('#f_middle').value;f.itemsMode=$('#f_items').value;f.itemsTitle=$('#f_ititle').value;f.outro=$('#f_outro').value;save();listFinalizations()}
function deleteFinalization(id){let used=[];db.plans.forEach(p=>p.decisions.forEach(d=>d.options.forEach(o=>{if(o.next===`FINAL:${id}`)used.push(p.name)})));let msg=used.length?`Esta finalización está usada por: ${[...new Set(used)].join(", ")}. Al eliminarla, esas opciones pasarán a FIN estándar. ¿Continuar?`:"¿Eliminar esta finalización?";if(!confirm(msg))return;db.plans.forEach(p=>p.decisions.forEach(d=>d.options.forEach(o=>{if(o.next===`FINAL:${id}`)o.next="END"})));db.finalizations=db.finalizations.filter(f=>f.id!==id);save();listFinalizations()}
function editDecision(id){let d=current.decisions.find(x=>x.id===id);$('#app').innerHTML=`<div class=card><h2>Decisión</h2><label>Pregunta / texto visible</label><textarea id=q>${esc(d.text)}</textarea><label>Imagen de la pregunta</label><input id=qim type=file accept="image/*">${d.image?`<img class=hero src="${d.image}">`:''}<div class=row style="margin-top:12px"><button class="btn primary" onclick="saveDecision('${id}')">Guardar pregunta</button><button class=btn onclick="addOption('${id}')">+ Opción</button><button class=btn onclick=renderBuilder()>Volver</button><button class="btn danger" onclick="deleteDecision('${id}')">Eliminar decisión</button></div></div>`+d.options.map(o=>optionEditor(d,o)).join('')}
function autoGrow(el){el.style.height="auto";el.style.height=Math.max(58,el.scrollHeight)+"px"}
function optionEditor(d,o){let decs=current.decisions.filter(x=>x.id!==d.id),items=current.items;return `<div class=card><h3>Opción visible</h3><label>Texto</label><textarea id="t_${o.id}" rows="2" style="min-height:58px;resize:vertical;overflow:hidden" oninput="autoGrow(this)">${esc(o.text||'')}</textarea><label>Imagen</label><input id="img_${o.id}" type=file accept="image/*">${o.image?`<img class=hero src="${o.image}">`:''}<label>Ítem oculto otorgado</label><select id="it_${o.id}"><option value="">Ninguno</option>${items.map(i=>`<option value="${i.id}" ${o.itemId===i.id?'selected':''}>${esc(i.name)}</option>`).join('')}</select><label>Siguiente paso</label><select id="nx_${o.id}"><option value="END">FIN estándar</option><optgroup label="Finalizaciones">${(db.finalizations||[]).map(f=>`<option value="FINAL:${f.id}" ${o.next===`FINAL:${f.id}`?'selected':''}>${esc(f.name||"Finalización")}</option>`).join('')}</optgroup><optgroup label="Decisiones de este plan">${decs.map(x=>`<option value="${x.id}" ${o.next===x.id?'selected':''}>${esc(x.text||'Sin título')}</option>`).join('')}</optgroup><optgroup label="Ir a otro plan">${db.plans.filter(p=>p.id!==current.id).map(p=>`<option value="PLAN:${p.id}" ${o.next===`PLAN:${p.id}`?'selected':''}>${esc(p.name)}</option>`).join('')}</optgroup></select><div class=row style="margin-top:12px"><button class="btn primary" onclick="saveOption('${d.id}','${o.id}')">Guardar opción</button><button class="btn danger" onclick="delOption('${d.id}','${o.id}')">Eliminar</button></div></div>`}
function deleteDecision(id){
  let d=current.decisions.find(x=>x.id===id);if(!d)return;
  let incoming=[];
  current.decisions.forEach(x=>x.options.forEach(o=>{if(o.next===id)incoming.push(x.text||"Decisión sin título")}));
  let msg=incoming.length?`Esta decisión recibe conexiones desde: ${[...new Set(incoming)].join(", ")}. Al eliminarla, esas conexiones pasarán a FIN. ¿Continuar?`:"¿Eliminar esta decisión?";
  if(!confirm(msg))return;
  current.decisions.forEach(x=>x.options.forEach(o=>{if(o.next===id)o.next="END"}));
  current.decisions=current.decisions.filter(x=>x.id!==id);
  if(current.start===id)current.start=current.decisions[0]?.id||null;
  save();renderBuilder();
}
function addOption(did){let d=current.decisions.find(x=>x.id===did);syncDecisionEditor(did);d.options.push({id:uid(),text:"Nueva opción",image:"",itemId:"",next:"END"});save();editDecision(did)}
function saveDecision(id){let d=current.decisions.find(x=>x.id===id);syncDecisionEditor(id);fileData($('#qim'),x=>{if(x)d.image=x;save();editDecision(id)})}
function syncDecisionEditor(did){let d=current.decisions.find(x=>x.id===did);if(!d)return;let q=document.getElementById('q');if(q)d.text=q.value;d.options.forEach(o=>{let t=document.getElementById('t_'+o.id),it=document.getElementById('it_'+o.id),nx=document.getElementById('nx_'+o.id);if(t)o.text=t.value;if(it)o.itemId=it.value;if(nx)o.next=nx.value})}
function saveOption(did,oid){let d=current.decisions.find(x=>x.id===did),o=d.options.find(x=>x.id===oid);syncDecisionEditor(did);fileData($('#img_'+oid),x=>{if(x)o.image=x;save();editDecision(did)})}
function delOption(did,oid){let d=current.decisions.find(x=>x.id===did);syncDecisionEditor(did);d.options=d.options.filter(x=>x.id!==oid);save();editDecision(did)}
function clonePlan(id){
  let src=db.plans.find(p=>p.id===id);if(!src)return;
  let dm={},im={};src.decisions.forEach(d=>dm[d.id]=uid());src.items.forEach(i=>im[i.id]=uid());
  let copy={...src,id:uid(),name:src.name+" (copia)",start:src.start?dm[src.start]:null,
    items:src.items.map(i=>({...i,id:im[i.id]})),
    decisions:src.decisions.map(d=>({...d,id:dm[d.id],options:d.options.map(o=>({...o,id:uid(),itemId:o.itemId?(im[o.itemId]||""):o.itemId,next:o.next==="END"?"END":String(o.next||"").startsWith("PLAN:")?o.next:(dm[o.next]||"END")}))}))
  };
  db.plans.push(copy);save();showHome();
}
function delPlan(id){let refs=[];db.plans.forEach(p=>p.decisions.forEach(d=>d.options.forEach(o=>{if(o.next===`PLAN:${id}`)refs.push(p.name)})));let msg=refs.length?`Este plan está conectado desde: ${[...new Set(refs)].join(", ")}. Si lo eliminás, esas conexiones quedarán rotas. ¿Eliminar igualmente?`:"¿Eliminar este plan?";if(confirm(msg)){db.plans=db.plans.filter(p=>p.id!==id);save();showHome()}}
function openPlayer(){let visible=db.plans.filter(p=>p.showInPlayer!==false);if(visible.length===1)return play(visible[0].id);if(!visible.length){$('#app').innerHTML='<div class=card><h2>No hay planes visibles</h2><div class=muted>Activá “Mostrar este plan en el panel Ejecutar” desde el Builder.</div></div>';return}$('#app').innerHTML='<div class=card><h2>Elegí un plan</h2></div>'+visible.map(p=>`<button class=choice onclick="play('${p.id}')"><div class=ct>${esc(p.name)}</div></button>`).join('')}
function play(id){current=db.plans.find(p=>p.id===id);history=[];awarded=[];if(!current.start)return alert("Este plan no tiene decisión inicial.");setExecutionMode(true);renderPlay(current.start)}
function playFrom(planId,decisionId){current=db.plans.find(p=>p.id===planId);history=[];awarded=[];setExecutionMode(true);renderPlay(decisionId)}
function renderPlay(id){let d=current.decisions.find(x=>x.id===id);if(!d)return results();let showName=current.hideNameInPlayer===false&&String(current.name||'').trim();let showQuestion=String(d.text||'').trim();let intro=(showName||showQuestion||d.image)?`<div class=card>${showName?`<div class=muted>${esc(current.name)}</div>`:''}${d.image?`<img class=hero src="${d.image}">`:''}${showQuestion?`<h2>${esc(d.text)}</h2>`:''}</div>`:'';$('#app').innerHTML=intro+d.options.map(o=>`<button class=choice onclick="choose('${d.id}','${o.id}')">${o.image?`<img src="${o.image}">`:''}<div class=ct>${esc(o.text)}</div></button>`).join('')}
function choose(did,oid){let d=current.decisions.find(x=>x.id===did),o=d.options.find(x=>x.id===oid);history.push({planId:current.id,decisionId:did,optionId:oid});if(o.itemId)awarded.push({planId:current.id,itemId:o.itemId});if(o.next==="END")return results();if(String(o.next||"").startsWith("FINAL:"))return results(o.next.slice(6));if(String(o.next||"").startsWith("PLAN:")){let target=db.plans.find(p=>p.id===o.next.slice(5));if(!target)return alert("El plan de destino ya no existe.");if(!target.start)return alert("El plan de destino no tiene decisión inicial.");current=target;return renderPlay(target.start)}renderPlay(o.next)}
function lowerFirst(s=''){return s?s.charAt(0).toLocaleLowerCase()+s.slice(1):''}
function sentenceForChoice(question,option){
  let raw=String(question||'').trim(),o=lowerFirst(String(option||'').trim());
  if(!raw)return o;
  let isQuestion=raw.includes('?')||raw.includes('¿');
  let q=raw.replace(/^¿/,'').replace(/[?¿]+$/g,'').trim();
  let text=isQuestion?`${q}: ${o}`:`${q} ${o}`;
  text=text.replace(/\s+/g,' ').trim();
  return /[.!?…]$/.test(text)?text:text+'.';
}
function results(finalId=null){setExecutionMode(true);let f=finalId?(db.finalizations||[]).find(x=>x.id===finalId):null;if(!f)f={title:"Prepárate para…",intro:"",journeyMode:"all",journeyTitle:"",middle:"",itemsMode:"all",itemsTitle:"",outro:""};let pid=current?.id,hh=f.journeyMode==="current"?history.filter(s=>(s.planId||pid)===pid):history;let journey=f.journeyMode==="none"?"":hh.map((s,n)=>{let pp=db.plans.find(x=>x.id===(s.planId||pid)),d=pp?.decisions.find(x=>x.id===s.decisionId),o=d?.options.find(x=>x.id===s.optionId);return o?`<div style="padding:10px 0;${n?'border-top:1px solid #eceff3':''}"><span class=muted>${n+1}.</span> ${esc(sentenceForChoice(d.text,o.text))}</div>`:""}).join("");let aa=f.itemsMode==="current"?awarded.filter(x=>typeof x!=="string"&&x.planId===pid):awarded,uniq=[],seen=new Set();if(f.itemsMode!=="none")aa.forEach(x=>{let p2=typeof x==="string"?pid:x.planId,iid=typeof x==="string"?x:x.itemId,k=p2+"|"+iid;if(seen.has(k))return;seen.add(k);let pp=db.plans.find(y=>y.id===p2),it=pp?.items.find(y=>y.id===iid);if(it)uniq.push(it)});let parts=[];if(String(f.title||"").trim())parts.push(`<div class=card><h2>${esc(f.title)}</h2></div>`);if(String(f.intro||"").trim())parts.push(`<div class=card>${esc(f.intro).replace(/\n/g,"<br>")}</div>`);if(journey)parts.push(`<div class=card>${String(f.journeyTitle||"").trim()?`<h3>${esc(f.journeyTitle)}</h3>`:""}${journey}</div>`);if(String(f.middle||"").trim())parts.push(`<div class=card>${esc(f.middle).replace(/\n/g,"<br>")}</div>`);if(uniq.length)parts.push(`<div class=card>${String(f.itemsTitle||"").trim()?`<h3>${esc(f.itemsTitle)}</h3>`:""}${uniq.map(i=>`<div class=item>${i.image?`<img src="${i.image}">`:""}${String(i.name||"").trim()?`<h3>${esc(i.name)}</h3>`:""}${String(i.description||"").trim()?`<div>${esc(i.description).replace(/\n/g,"<br>")}</div>`:""}</div>`).join("")}</div>`);if(String(f.outro||"").trim())parts.push(`<div class=card>${esc(f.outro).replace(/\n/g,"<br>")}</div>`);
parts.push(`<footer class="card" style="margin-top:28px"><b>Decision Plan</b> <span style="font-size:12px;opacity:.65">v5.4</span><div class="tabs" style="margin-top:10px"><button class="btn primary" onclick="showRunHome()">✓ Finalizar</button><button class=btn onclick="returnToAdmin()">⚙ Administración</button></div></footer>`);
$('#app').innerHTML=parts.join("")}
async function exportAll(){let now=new Date();let payload={format:"DecisionPlanBackup",version:1,exportedAt:now.toISOString(),data:db};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='DecisionPlan-v5.4-backup-'+now.toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();localStorage.setItem("dp_last_backup",now.toISOString());setTimeout(()=>URL.revokeObjectURL(a.href),1000);showHome()}
function importAll(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let parsed=JSON.parse(r.result);let restored=(parsed&&parsed.format==="DecisionPlanBackup")?parsed.data:parsed;if(!restored||!Array.isArray(restored.plans))throw 0;if(!confirm(`Restaurar este backup reemplazará los ${db.plans.length} plan(es) actuales por ${restored.plans.length}. ¿Continuar?`))return;db=restored;await idbSave();showHome();alert("Backup restaurado correctamente.")}catch(e){alert("El archivo no es un backup válido de Decision Plan.")}};r.readAsText(f)}
idbLoad().then(x=>{db=x;showHome()}).catch(()=>showHome());
async function forceAppUpdate(){
  const b=document.getElementById("updateAppBtn");
  if(b){b.disabled=true;b.textContent="Buscando…";}
  try{
    if(!("serviceWorker" in navigator)){location.reload();return;}
    const reg=await navigator.serviceWorker.getRegistration("./") || await navigator.serviceWorker.register("./sw.js");
    await reg.update();
    if(reg.waiting){
      reg.waiting.postMessage({type:"SKIP_WAITING"});
      return;
    }
    if(reg.installing){
      reg.installing.addEventListener("statechange",()=>{
        if(reg.installing && reg.installing.state==="installed"){
          reg.installing.postMessage({type:"SKIP_WAITING"});
        }
      });
      return;
    }
    location.reload();
  }catch(e){
    alert("No se pudo comprobar la actualización. Verificá la conexión e intentá nuevamente.");
    if(b){b.disabled=false;b.textContent="↻ Actualizar app";}
  }
}
if("serviceWorker" in navigator){
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(reloading)return; reloading=true; location.reload();
  });
  window.addEventListener("load",async()=>{
    try{
      const reg=await navigator.serviceWorker.register("./sw.js");
      await reg.update();
      if(reg.waiting) reg.waiting.postMessage({type:"SKIP_WAITING"});
    }catch(e){}
  });
}
